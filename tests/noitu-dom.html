<!doctype html>
<html lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kiểm tra hàng Nối từ</title></head>
<body><div id="root"></div><pre id="results" data-status="running">Đang kiểm tra…</pre>
<script type="module">
  import React from 'react';
  import { createRoot } from 'react-dom/client';
  import { flushSync } from 'react-dom';
  import NoituTable from '/src/noitu/NoituTable.tsx';
  import '/src/styles/theme.css';
  import '/src/styles/app.css';

  const results = document.querySelector('#results');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const players = [{ id: 'p1', nickname: 'Mây', status: 'active' }, { id: 'p2', nickname: 'Mưa', status: 'active' }];
  const seats = players.map((p, i) => ({ id: p.id, nickname: p.nickname, isHost: i === 0, isYou: i === 0, online: true, ready: true }));
  const baseGame = { gameId: 'g1', turnId: 't1', phase: 'turn', currentPlayerId: 'p1', requiredSyllable: 'lọc', players,
    history: [{ kind: 'seed', playerId: null, nickname: '', word: 'nước lọc' }], historyCount: 1,
    proposal: null, deadlineAt: Date.now() + 30000, remainingMs: 30000, canSubmit: true, canGiveUp: true,
    proposalsThisTurn: 0, winnerId: null, usedCount: 1 };
  const baseRoom = { roomId: 'room1', code: 'ABCDEF', gameKey: 'noitu', visibility: 'private', phase: 'playing', revision: 1,
    paused: false, hostId: 'p1', players: seats, minPlayers: 2, maxPlayers: 6, canStart: false, startReason: null, notice: null };
  const root = createRoot(document.querySelector('#root'));
  const errors = [];
  let room = baseRoom;
  let game = baseGame;
  let rejectionEvent = null;
  function assert(ok, message) { if (!ok) errors.push(message); }
  function render() {
    const props = { snapshot: { ...room, game }, playerId: 'p1', connected: true, busy: false, draft: null, rejectionEvent,
      onRejectionAnimationDone: () => {}, onAction: async () => ({ ok: true }), onDraft: () => {}, onLeave: () => {}, onRules: () => {}, onRematch: () => {} };
    flushSync(() => root.render(React.createElement(NoituTable, props)));
  }
  const active = () => document.querySelector('li[data-active-turn]');
  const count = () => document.querySelectorAll('li[data-active-turn]').length;
  const bubble = () => active()?.querySelector('.noitu-message-bubble');
  const prefix = () => active()?.querySelector('.noitu-letter-tile');
  const fragments = () => active()?.querySelectorAll('.noitu-letter-fragments > .noitu-letter-tile').length ?? 0;
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  try {
    render();
    await wait(220);
    const rowNode = active(), bubbleNode = bubble(), prefixNode = prefix();
    assert(count() === 1, 'draft: phải có đúng một active li');
    const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;
    const firstInput = document.querySelector('#noitu-suffix');
    flushSync(() => { setter.call(firstInput, 'nhjfdlkg'); firstInput.dispatchEvent(new Event('input', { bubbles: true })); });
    const liveTiles = [...active().querySelectorAll('.noitu-letter-live > .noitu-letter-tile')];
    assert(new Set(liveTiles.map((tile) => tile.offsetTop)).size === 1, 'nhập dài: toàn bộ ô chữ phải nằm một dòng');
    const proposal = (id, word) => ({ id, proposerId: 'p1', word, acceptCount: 0, rejectCount: 0, canVote: false, deadlineAt: Date.now() + 15000, remainingMs: 15000 });
    game = { ...game, phase: 'voting', proposal: proposal('pr1', 'lọc cọc'), canSubmit: false };
    render();
    assert(count() === 1 && active() === rowNode && bubble() === bubbleNode && prefix() === prefixNode, 'vote: hàng/bubble/prefix phải giữ cùng DOM node');
    assert(fragments() === 0, 'vote chưa đủ phiếu không được vỡ');
    const suffixBefore = active().querySelector('[data-suffix-tile="true"]').getBoundingClientRect();
    const before = prefixNode.getBoundingClientRect();
    const beforeRow = rowNode.getBoundingClientRect();
    const beforeScroll = document.querySelector('.noitu-timeline').scrollTop;
    const beforeDock = document.querySelector('.noitu-dock').getBoundingClientRect();
    game = { ...game, phase: 'turn', proposal: null, canSubmit: true };
    rejectionEvent = { id: 1, gameId: 'g1', turnId: 't1', proposalId: 'pr1', proposerId: 'p1', word: 'lọc cọc', acceptCount: 0, rejectCount: 1 };
    render();
    assert(count() === 1 && active() === rowNode && bubble() === bubbleNode && prefix() === prefixNode, 'reject: hàng/bubble/prefix phải giữ cùng DOM node');
    assert(fragments() === (reduced ? 0 : 3), 'reject: hậu tố vỡ đồng thời, hoặc biến mất ngay khi giảm hiệu ứng');
    if (!reduced) {
      const ghost = active().querySelector('.noitu-letter-fragments > .noitu-letter-tile');
      const ghostRect = ghost.getBoundingClientRect();
      const timelineRect = document.querySelector('.noitu-timeline').getBoundingClientRect();
      assert(Math.abs(ghostRect.left - suffixBefore.left) < 2 && Math.abs(ghostRect.top - suffixBefore.top) < 2, 'reject: mảnh phải bắt đầu tại ô suffix cũ');
      assert(getComputedStyle(ghost).animationDelay === '0s', 'reject: toàn bộ hậu tố phải vỡ cùng lúc');
      assert(getComputedStyle(ghost).animationName === 'noitu-tile-break', 'reject: hiệu ứng vỡ phải thật sự được áp dụng');
      assert(ghostRect.bottom > timelineRect.top && ghostRect.top < timelineRect.bottom, 'reject: mảnh phải nằm trong vùng timeline nhìn thấy');
    }
    assert(!active().textContent.includes('Từ bị nhóm bác'), 'reject: không tạo hàng thông báo riêng');
    const after = prefixNode.getBoundingClientRect();
    assert(Math.abs(after.left - before.left) < 2 && Math.abs(after.top - before.top) < 2, `reject: prefix không được dịch vị trí (${before.left},${before.top} → ${after.left},${after.top}; row ${beforeRow.top}/${beforeRow.height} → ${rowNode.getBoundingClientRect().top}/${rowNode.getBoundingClientRect().height}; dock ${beforeDock.height} → ${document.querySelector('.noitu-dock').getBoundingClientRect().height}; scroll ${beforeScroll} → ${document.querySelector('.noitu-timeline').scrollTop})`);
    const input = document.querySelector('#noitu-suffix');
    input.focus();
    flushSync(() => { setter.call(input, 'mới'); input.dispatchEvent(new Event('input', { bubbles: true })); });
    assert(active()?.querySelector('.noitu-letter-word')?.getAttribute('aria-label')?.includes('mới'), 'nhập lại ngay: chữ mới phải hiện cùng bubble');
    assert(fragments() === (reduced ? 0 : 3), 'nhập lại: trạng thái mảnh vỡ không đúng');
    game = { ...game, phase: 'voting', proposal: proposal('pr2', 'lọc mới'), canSubmit: false };
    rejectionEvent = null;
    render();
    assert(count() === 1 && active() === rowNode && fragments() === 0, 'đề xuất tiếp theo: dọn ghost cũ, không thêm hàng');
    game = { ...game, phase: 'turn', proposal: null, canSubmit: true };
    rejectionEvent = { id: 2, gameId: 'g1', turnId: 't1', proposalId: 'pr2', proposerId: 'p1', word: 'lọc mới', acceptCount: 0, rejectCount: 1 };
    render();
    assert(count() === 1 && active() === rowNode && fragments() === (reduced ? 0 : 3), 'bác lần hai: cùng hàng, chỉ ghost mới hoặc không ghost khi giảm hiệu ứng');
    const nextInput = document.querySelector('#noitu-suffix');
    flushSync(() => { setter.call(nextInput, 'khác'); nextInput.dispatchEvent(new Event('input', { bubbles: true })); });
    await wait(500);
    assert(count() === 1 && active() === rowNode && bubble() === bubbleNode && prefix() === prefixNode, 'sau cleanup: hàng và prefix còn nguyên');
    assert(fragments() === 0, 'sau cleanup: ghost đã được dọn');
    assert(nextInput.value === 'khác', 'cleanup không được xóa input mới');
    assert(active()?.querySelector('.noitu-letter-word')?.getAttribute('aria-label')?.includes('khác'), 'cleanup không được xóa ô chữ mới');
    room = { ...room, paused: true };
    render();
    assert(count() === 1 && active() === rowNode && fragments() === 0, 'pause: không replay fragment hoặc thêm hàng');
    room = { ...room, paused: false };
    render();
    assert(count() === 1 && active() === rowNode && fragments() === 0, 'resume: không replay fragment');
    game = { ...game, turnId: 't2', phase: 'turn', requiredSyllable: 'mới', proposal: null,
      history: [...game.history, { kind: 'accepted', playerId: 'p1', nickname: 'Mây', word: 'lọc mới', acceptedByGroup: true }], historyCount: 2 };
    rejectionEvent = null;
    render();
    assert(count() === 1 && active() !== rowNode && fragments() === 0, 'accept/chuyển lượt: hàng mới chỉ theo snapshot server, không vỡ');
    const nextRow = active();
    rejectionEvent = { id: 3, gameId: 'g1', turnId: 't2', proposalId: 'pr3', proposerId: 'p1', word: 'mới lạ', acceptCount: 0, rejectCount: 1 };
    render();
    assert(count() === 1 && active() === nextRow && fragments() === (reduced ? 0 : 2), 'snapshot vote bị gộp: vẫn phải dựng mảnh từ snapshot bác trên cùng hàng');
    assert(document.documentElement.scrollWidth <= window.innerWidth, 'trang không được tràn ngang');
  } catch (error) { errors.push(String(error?.stack ?? error)); }
  results.dataset.status = errors.length ? 'fail' : 'pass';
  results.textContent = errors.length ? `FAIL\n${errors.join('\n')}` : `PASS · một active li, DOM identity, prefix, mảnh vỡ, nhập lại, cleanup, lượt mới · ${window.innerWidth}px · reduced=${matchMedia('(prefers-reduced-motion: reduce)').matches}`;
</script></body></html>
